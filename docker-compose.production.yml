version: '3.8'

services:
  backend:
    image: chatbot-langgraph-backend:production
    container_name: fastapi-backend-production
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/chatbot_production}
    volumes:
      - ./API-chatbot-langgraph/logs:/app/logs
      - ./API-chatbot-langgraph/data:/app/data
    networks:
      - production-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: chatbot-langgraph-frontend:production
    container_name: react-frontend-production
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://${SERVER_HOST:-localhost}:8000
      - REACT_APP_ENV=production
    networks:
      - production-network
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production Database
  db:
    image: postgres:15-alpine
    container_name: postgres-production
    environment:
      - POSTGRES_DB=chatbot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./DATABASE/init:/docker-entrypoint-initdb.d
      - ./DATABASE/backups:/backups
    ports:
      - "5432:5432"
    networks:
      - production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - production-network
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

networks:
  production-network:
    driver: bridge

volumes:
  postgres_production_data:
    driver: local
